[project]
name = "research-python"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "astropy",
    "h5py",
    "tables",
    "iminuit",
    "jupyterlab",
    "ipykernel",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
